<style>
/* ─── RESET & BASE ─────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F2;
  --surface:#FFFFFF;
  --surface2:#F0EEE8;
  --border:#E2DFD6;
  --text:#1A1814;
  --text2:#6B6860;
  --text3:#A09D98;
  --accent:#2B4EFF;
  --accent-light:#EEF1FF;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
  --font:'DM Sans',sans-serif;
  --font-display:'DM Serif Display',serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ─── LOGIN SCREEN ─────────────────────────────────────── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:24px;
}
.login-card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:48px 44px;max-width:440px;width:100%;text-align:center;
  box-shadow:var(--shadow);
}
.login-title{font-family:var(--font-display);font-size:26px;color:var(--text);margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:32px;line-height:1.5}
.google-btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:13px 20px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--surface);
  font-family:var(--font);font-size:15px;font-weight:500;color:var(--text);
  cursor:pointer;transition:all .15s;
}
.google-btn:hover{background:var(--surface2);border-color:#ccc}
.google-btn svg{width:20px;height:20px;flex-shrink:0}

/* ─── APP WORKSPACE FRAMES ────────────────────────────── */
#app{display:none;min-height:100vh;flex-direction:column}
#app.visible{display:flex}
.topnav{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;gap:16px;height:60px;
}
.topnav-spacer{flex:1}
.topnav-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;}
.logout-btn{padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;cursor:pointer;}
.app-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);border:none;background:none;font-family:var(--font);font-size:14px;color:var(--text2);cursor:pointer;width:100%;text-align:left;}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.main-content{flex:1;overflow-y:auto;padding:28px 32px}
.page{display:none}
.page.active{display:block}
.profile-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;display:flex;align-items:center;gap:24px;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.info-row{display:flex;flex-direction:column;padding:12px 0;border-bottom:1px solid var(--border)}
.info-row:nth-child(odd){padding-right:24px;border-right:1px solid var(--border)}
.info-row:nth-child(even){padding-left:24px}
.info-label{font-size:12px;color:var(--text3);margin-bottom:2px;font-weight:500}
.info-val{font-size:14px;color:var(--text);font-weight:500}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<script>
/* ═══════════════════════════════════════════════════════════
   ENVIRONMENT VARIABLES INITIALIZATION
═══════════════════════════════════════════════════════════ */
window.CONFIG = {
  GOOGLE_CLIENT_ID: '546265155462-daji3rvlhjehu8eipb9pkl07efk1jt6e.apps.googleusercontent.com',
  SHEETS_API_KEY: 'AIzaSyBy55WhovpXDWRa5O3hiuWsHbvTUtiVpI0',
  SPREADSHEET_ID: '1s-uywnbanv9mBZO34mNuwZzllemnnHfMkuVPFAPvQn0',
  SUPABASE_URL: "https://ofhcxvekfplhgzpxutce.supabase.co/rest/v1/",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9maGN4dmVrZnBsaGd6cHh1dGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDg5MDIsImV4cCI6MjA5NjgyNDkwMn0.0X57t9-4u3TO1tBn1wIkj0R-0RJfvDgolC5nRtQrUlE"
};

let supabaseClient = null;
let currentStudent = null;

// Initialize Supabase client safely
function initSupabase() {
  if (window.supabase && !supabaseClient) {
    supabaseClient = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY);
    console.log("🔒 Supabase Engine Initialized Successfully.");
  }
}

function loginWithGoogle() {
  initSupabase();
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
    alert("Google Identity Services are still loading. Please wait 2 seconds.");
    return;
  }
  google.accounts.id.initialize({
    client_id: window.CONFIG.GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential
  });
  google.accounts.id.prompt();
}

async function handleGoogleCredential(response) {
  try {
    const base64Url = response.credential.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    
    const payload = JSON.parse(jsonPayload);
    if (payload && payload.email) {
      await verifyStudentAgainstDatabase(payload.email.trim().toLowerCase());
    }
  } catch (e) {
    console.error("JWT decoding fault:", e);
    alert("Authentication tracking error. Please clear your cache and try again.");
  }
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   STRICT DATABASE LOOKUP ENGINE (NO HARDCODING fallbackS)
═══════════════════════════════════════════════════════════ */
async function verifyStudentAgainstDatabase(email) {
  initSupabase();
  if (!supabaseClient) {
    alert("System error: Supabase library failed to initialize. Refresh and try again.");
    return;
  }

  console.log(`🔍 Querying Supabase 'students' table for exact email match: ${email}`);
  
  try {
    const { data: studentProfile, error } = await supabaseClient
      .from('students')
      .select('*')
      .eq('email', email)
      .maybeSingle(); // Prevents throwing 406 errors on missing rows

    if (error) {
      console.error("Supabase Database Query Error:", error);
      alert(`Database Error: ${error.message}`);
      return;
    }

    if (!studentProfile) {
      // Zero fallbacks. Strict refusal if email is missing from your table.
      alert(`⚠️ Access Denied:\n\nThe email address "${email}" was not found in the Supabase 'students' table.\n\nPlease update your table records first.`);
      return;
    }

    // Map profile keys directly from your database column names
    currentStudent = {
      id: studentProfile.id || studentProfile.student_id,
      name: studentProfile.name,
      email: studentProfile.email,
      phone: studentProfile.phone || 'N/A',
      batch: studentProfile.batch || 'UNASSIGNED',
      target_exam: studentProfile.target_exam || 'CAT'
    };

    sessionStorage.setItem('sp_student', JSON.stringify(currentStudent));
    launchPortalShell();

  } catch (err) {
    console.error("Runtime exception during database verification:", err);
    alert("An unexpected error occurred during database lookup.");
  }
}

function launchPortalShell() {
  const s = currentStudent;
  const initials = String(s.name).split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  
  document.getElementById('nav-avatar').textContent = initials;
  document.getElementById('profile-avatar').textContent = initials;
  document.getElementById('nav-name').textContent = s.name;
  document.getElementById('nav-batch').textContent = `${s.target_exam} · ${s.batch}`;
  
  document.getElementById('profile-name').textContent = s.name;
  document.getElementById('profile-meta').textContent = `ID: ${s.id} · Target: ${s.target_exam}`;
  
  document.getElementById('d-name').textContent = s.name;
  document.getElementById('d-email').textContent = s.email;
  document.getElementById('d-phone').textContent = s.phone;
  document.getElementById('d-batch').textContent = s.batch;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
}

window.onload = () => {
  initSupabase();
  const saved = sessionStorage.getItem('sp_student');
  if (saved) {
    currentStudent = JSON.parse(saved);
    launchPortalShell();
  }
};

function logout() {
  sessionStorage.removeItem('sp_student');
  location.reload();
}

function showPage(pageId, element) {}
</script>
